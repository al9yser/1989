name: Android APK Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mufakkik-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate Kotlin and build installable debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK and checksum
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/AL-MUFAKKIK-v0.2.0-debug.apk
          sha256sum release/AL-MUFAKKIK-v0.2.0-debug.apk > release/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AL-MUFAKKIK-v0.2.0-APK
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: AL-MUFAKKIK v0.2.0
          target_commitish: main
          generate_release_notes: true
          make_latest: true
          files: |
            release/AL-MUFAKKIK-v0.2.0-debug.apk
            release/SHA256SUMS.txt
